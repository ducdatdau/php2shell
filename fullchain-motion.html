<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>php2shell Full Chain</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #1a1b22; --bg2: #21222b; --bg3: #2b2d38; --bg4: #353845;
  --fg: #d4d4dc; --fg2: #969aac; --fg3: #686c80;
  --green: #6ecf8e; --green-dim: rgba(110,207,142,.1); --green-glow: rgba(110,207,142,.2);
  --red: #d96070; --red-dim: rgba(217,96,112,.1); --red-glow: rgba(217,96,112,.25);
  --orange: #c9a050; --orange-dim: rgba(201,160,80,.1);
  --cyan: #6bb4cc; --cyan-dim: rgba(107,180,204,.1);
  --purple: #9a86b8; --purple-dim: rgba(154,134,184,.1);
  --blue: #6a8dba;
  --mono: 'SF Mono', SFMono-Regular, ui-monospace, 'Menlo', 'Monaco', 'Cascadia Mono', 'Consolas', monospace;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:#1a1b22;--bg2:#21222b;--bg3:#2b2d38;--bg4:#353845;--fg:#d4d4dc;--fg2:#969aac;--fg3:#686c80;
    --green:#6ecf8e;--green-dim:rgba(110,207,142,.1);--green-glow:rgba(110,207,142,.2);
    --red:#d96070;--red-dim:rgba(217,96,112,.1);--red-glow:rgba(217,96,112,.25);
    --orange:#c9a050;--orange-dim:rgba(201,160,80,.1);--cyan:#6bb4cc;--cyan-dim:rgba(107,180,204,.1);
    --purple:#9a86b8;--purple-dim:rgba(154,134,184,.1);--blue:#6a8dba;color-scheme:dark;
  }
}
:root[data-theme="light"] {
  --bg:#1a1b22;--bg2:#21222b;--bg3:#2b2d38;--bg4:#353845;--fg:#d4d4dc;--fg2:#969aac;--fg3:#686c80;
  --green:#6ecf8e;--green-dim:rgba(110,207,142,.1);--green-glow:rgba(110,207,142,.2);
  --red:#d96070;--red-dim:rgba(217,96,112,.1);--red-glow:rgba(217,96,112,.25);
  --orange:#c9a050;--orange-dim:rgba(201,160,80,.1);--cyan:#6bb4cc;--cyan-dim:rgba(107,180,204,.1);
  --purple:#9a86b8;--purple-dim:rgba(154,134,184,.1);--blue:#6a8dba;color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);
  padding-left:max(24px,env(safe-area-inset-left,0px));
  padding-right:max(24px,env(safe-area-inset-right,0px));
  padding-block:0;display:flex;flex-direction:column;height:100%;overflow:hidden}

.hdr{text-align:center;padding:.6rem 0 .3rem;flex-shrink:0}
.hdr h1{font-family:var(--mono);font-size:clamp(1.15rem,3vw,1.6rem);font-weight:700;color:var(--green);letter-spacing:-.02em}
.hdr p{font-size:.85rem;color:var(--fg2);margin-top:.2rem}

.tabs{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;padding-bottom:.35rem;flex-shrink:0}
.tab{font-family:var(--mono);font-size:.75rem;font-weight:600;padding:.35rem .75rem;border-radius:6px;
  background:var(--bg2);color:var(--fg3);border:1px solid var(--bg3);cursor:pointer;transition:all .25s;white-space:nowrap}
.tab:hover{border-color:var(--fg3)}
.tab.a{--tc:var(--green);--td:var(--green-dim)}.tab.b{--tc:var(--cyan);--td:var(--cyan-dim)}
.tab.active{background:var(--td);color:var(--tc);border-color:var(--tc)}

.prog{display:flex;gap:3px;justify-content:center;padding:.2rem 0;flex-shrink:0}
.dot{width:1.8rem;height:4px;border-radius:2px;background:var(--bg3);cursor:pointer;transition:all .35s}
.dot.active{box-shadow:0 0 6px var(--green)}
.dot.past{background:var(--fg3)}
.dot.a1{--dc:var(--green)}.dot.b1{--dc:var(--cyan)}.dot.a2{--dc:var(--orange)}.dot.b2{--dc:var(--red)}
.dot.active{background:var(--dc,var(--green))}

.main{flex:1;display:flex;gap:.5rem;padding:.2rem 0 .3rem;min-height:0;overflow:hidden}
.main-top{display:flex;flex-direction:column;gap:.5rem;min-height:0;flex:1 1 55%;overflow:hidden}
.vis{background:var(--bg2);border:1px solid var(--bg3);border-radius:10px;padding:1rem 1.2rem;
  display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;flex:1;min-width:0;min-height:0}
.sidebar{display:flex;flex-direction:column;gap:.5rem;flex-shrink:0;overflow:hidden}
.vals{background:var(--bg2);border:1px solid var(--bg3);border-radius:8px;padding:.65rem .75rem;
  display:flex;flex-direction:row;gap:.4rem;flex-wrap:wrap}
.vals-title{font-family:var(--mono);font-size:.78rem;color:var(--fg3);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:.15rem;flex-basis:100%}
.vp-item{display:flex;flex-direction:column;gap:.1rem;padding:.35rem .55rem;border-radius:6px;
  background:var(--bg);border:1px solid var(--bg3);font-family:var(--mono);font-size:.78rem;min-width:0;flex:1}
.vp-key{color:var(--fg3);font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.vp-val{color:var(--fg);font-weight:600;word-break:break-all;font-size:.75rem}
.vp-item.changed{border-color:var(--orange);background:var(--orange-dim)}
.vp-item.changed .vp-val{color:var(--orange)}
.vp-item.danger{border-color:var(--red);background:var(--red-dim)}
.vp-item.danger .vp-val{color:var(--red)}
.vp-item.ok{border-color:var(--green);background:var(--green-dim)}
.vp-item.ok .vp-val{color:var(--green)}
.vp-item.dim{opacity:.35}

/* http request block */
.httpreq{background:var(--bg2);border:1px solid var(--bg3);border-radius:10px;overflow:hidden}
.httpreq-hdr{display:flex;align-items:center;gap:.4rem;padding:.4rem .6rem;user-select:none}
.httpreq-tag{font-family:var(--mono);font-size:.72rem;font-weight:700;padding:.2rem .5rem;border-radius:5px;text-transform:uppercase}
.httpreq-tag.a1t{background:var(--green-dim);color:var(--green)}
.httpreq-tag.b1t{background:var(--cyan-dim);color:var(--cyan)}
.httpreq-tag.a2t{background:var(--orange-dim);color:var(--orange)}
.httpreq-tag.b2t{background:var(--red-dim);color:var(--red)}
.httpreq-label{font-family:var(--mono);font-size:.78rem;color:var(--fg2);flex:1}

.httpreq-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.httpreq-body.open{max-height:500px;overflow-y:auto}
.httpreq-pre{font-family:var(--mono);font-size:.75rem;line-height:1.6;padding:.5rem .7rem;color:var(--fg2);white-space:pre;overflow-x:auto}
.httpreq-pre .hl-line{color:var(--fg)}.httpreq-pre .hl-val{color:var(--fg2)}.httpreq-pre .hl-key{color:var(--fg2)}
.httpreq-pre .hl-danger{color:var(--red);font-weight:600}

.expl{background:var(--bg2);border:1px solid var(--bg3);border-radius:10px;padding:.8rem 1rem;overflow-y:auto;flex:0 1 45%;min-height:0;min-width:320px}
.expl .tag{font-family:var(--mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.3rem;font-weight:600}
.expl .tag.a1c{color:var(--green)}.expl .tag.b1c{color:var(--cyan)}.expl .tag.a2c{color:var(--orange)}.expl .tag.b2c{color:var(--red)}
.expl h2{font-size:1.2rem;font-weight:700;margin-bottom:.5rem;text-wrap:balance;line-height:1.35}
.expl p{font-size:1rem;line-height:1.7;color:var(--fg2)}
.expl p+p{margin-top:.4rem}
.expl code{font-family:var(--mono);font-size:.88rem;background:var(--bg3);padding:.12em .35em;border-radius:3px;color:var(--fg)}
.hl{font-weight:600}.hl-g{color:var(--fg)}.hl-r{color:var(--red)}.hl-o{color:var(--fg)}.hl-c{color:var(--fg)}

.cc{margin-top:.7rem;border:1px solid var(--bg3);border-radius:8px;padding:.6rem .75rem;background:var(--bg)}
.cc-title{font-family:var(--mono);font-size:.72rem;color:var(--fg3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.4rem}
.cc-row{display:flex;align-items:baseline;gap:.4rem;padding:.25rem 0;font-family:var(--mono);font-size:.8rem;line-height:1.5}
.cc-fn{color:var(--fg2);white-space:nowrap}.cc-loc{color:var(--fg3);font-size:.68rem;white-space:nowrap}
.cc-indent{display:inline-block}
.cc-row.active .cc-fn{color:var(--fg);font-weight:600}.cc-row.boom .cc-fn{color:var(--red)}
.cc-row.skip{opacity:.3;text-decoration:line-through}
.cc-note{font-size:.68rem;color:var(--fg3);margin-left:.35rem;font-style:italic}
.cc-row.boom .cc-note{color:var(--red)}

.nav{display:flex;gap:.6rem;padding:.4rem 0 .5rem;justify-content:center;align-items:center;flex-shrink:0}
.nav button{font-family:var(--mono);font-size:.9rem;font-weight:600;padding:.5rem 1.4rem;border:1px solid var(--bg3);
  border-radius:8px;background:var(--bg2);color:var(--fg);cursor:pointer;transition:all .2s}
.nav button:hover:not(:disabled){border-color:var(--green);color:var(--green)}
.nav button:disabled{opacity:.25;cursor:default}
.nav .pri{background:var(--green);color:var(--bg);border-color:var(--green)}
.nav .pri:hover:not(:disabled){opacity:.88}
.nav .ctr{font-family:var(--mono);font-size:.82rem;color:var(--fg2);min-width:4rem;text-align:center}

.ac{width:100%;max-width:700px;margin:auto}
.col-c{display:flex;flex-direction:column;align-items:center;gap:.5rem;width:100%}

.ent-row{display:flex;align-items:center;justify-content:space-between;gap:.5rem;width:100%}
.ent{display:flex;flex-direction:column;align-items:center;gap:.25rem}
.ent-ico{width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.15rem;flex-shrink:0;font-family:var(--mono);font-weight:700}
.ent-lbl{font-family:var(--mono);font-size:.68rem;color:var(--fg2)}
.atr{flex:1;height:28px;position:relative;overflow:hidden;min-width:50px}
.atr-line{position:absolute;top:50%;left:0;right:14px;height:2px;background:var(--fg3);transform:translateY(-50%)}
.atr-head{position:absolute;top:50%;right:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:14px solid var(--fg3);transform:translateY(-50%)}
.pkt{position:absolute;top:50%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:.68rem;font-weight:700;padding:.2rem .55rem;border-radius:4px;white-space:nowrap;opacity:0}
.pkt.fly{animation:fly 1.4s ease-in-out forwards}
@keyframes fly{0%{left:5%;opacity:0}12%{opacity:1}88%{opacity:1}100%{left:88%;opacity:0}}

.mbar{width:100%;height:32px;background:var(--bg3);border-radius:7px;overflow:hidden;position:relative}
.mfill{height:100%;width:0;border-radius:6px;transition:width 1.6s ease-in-out,background .4s;position:relative}
.mfill.ok{background:linear-gradient(90deg,var(--blue),var(--purple))}.mfill.hot{background:linear-gradient(90deg,var(--orange),var(--red))}
.mfill .ml{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:.72rem;font-weight:700;color:#fff}
.mbar .mlim{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:.65rem;color:var(--fg3)}

.gate{width:100%;max-width:420px;border:1.5px solid var(--fg3);border-radius:8px;padding:.65rem .75rem;transition:border-color .4s}
.gate.ok{border-color:var(--green)}
.gate-t{font-family:var(--mono);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--fg3);text-align:center;margin-bottom:.35rem}
.gr{display:flex;justify-content:space-between;align-items:center;padding:.25rem 0;border-top:1px solid var(--bg3);font-family:var(--mono);font-size:.85rem}
.gr .l{color:var(--fg2)}.gr .v{font-weight:700}.v-g{color:var(--green)}
.gv{text-align:center;margin-top:.3rem;padding:.35rem;border-radius:6px;font-family:var(--mono);font-weight:700;font-size:.88rem;opacity:0;transition:opacity .4s}
.gv.show{opacity:1}.gv.ok{background:var(--green-dim);color:var(--green)}

.heap{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:560px}
.hb{width:18px;height:18px;border-radius:3px;background:var(--bg3);transition:all .3s}
.hb.u{background:var(--blue);opacity:.4}
.hb.ps{background:var(--orange);box-shadow:0 0 6px var(--orange);animation:pbl 1.5s infinite}
.hb.hsv{background:var(--purple);box-shadow:0 0 6px var(--purple);animation:pbl2 1.5s infinite}
@keyframes pbl{0%,100%{box-shadow:0 0 3px var(--orange)}50%{box-shadow:0 0 10px var(--orange)}}
@keyframes pbl2{0%,100%{box-shadow:0 0 3px var(--purple)}50%{box-shadow:0 0 10px var(--purple)}}

.sbox{border:1.5px solid var(--orange);border-radius:8px;padding:.6rem .7rem;font-family:var(--mono);font-size:.82rem;max-width:300px;width:100%}
.sbox.pp{border-color:var(--purple)}.sbox.rr{border-color:var(--red)}
.sbox .st{font-weight:700;font-size:.85rem;margin-bottom:.25rem}
.sbox .st.og{color:var(--orange)}.sbox .st.ppc{color:var(--purple)}.sbox .st.rrc{color:var(--red)}
.sf{display:flex;justify-content:space-between;padding:.18rem 0;color:var(--fg2);font-size:.78rem}
.sf .fn{color:var(--cyan)}

.cbl{font-family:var(--mono);font-size:.82rem;line-height:1.65;padding:.6rem .75rem;background:var(--bg3);border-radius:7px;overflow-x:auto}
.cl{padding:.12rem .5rem;border-radius:4px;transition:all .3s;white-space:nowrap}
.cl.ex{background:var(--green-dim);color:var(--green)}.cl.sk{opacity:.2;text-decoration:line-through}
.cl.bm{background:var(--red-dim);color:var(--red)}

.ptr-r{display:flex;align-items:center;gap:1rem;justify-content:center;flex-wrap:wrap}
.pb{padding:.55rem .9rem;border-radius:7px;text-align:center;font-family:var(--mono);font-size:.85rem;font-weight:600;min-width:110px}
.pb.mod{border:2px solid var(--purple);background:var(--bg3);color:var(--purple)}
.pb.mem{border:2px solid var(--fg3);background:var(--bg3);color:var(--fg2)}
.pb.fr{border-style:dashed;opacity:.5;background:repeating-linear-gradient(45deg,var(--bg3),var(--bg3) 3px,var(--bg2) 3px,var(--bg2) 6px)}
.pl{width:50px;height:2px;flex-shrink:0;position:relative}
.pl::after{content:'';position:absolute;right:-1px;top:-4px;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:8px solid}
.pl.red{background:var(--red)}.pl.red::after{border-left-color:var(--red)}
.pl.blink{animation:blk 1s infinite}
@keyframes blk{0%,100%{opacity:1}50%{opacity:.25}}

.alert{text-align:center;padding:.55rem 1rem;border-radius:7px;font-family:var(--mono);font-weight:700;font-size:.95rem;opacity:0;transition:all .4s;transform:scale(.92)}
.alert.s{opacity:1;transform:scale(1)}
.alert.red{background:var(--red-dim);color:var(--red);border:2px solid var(--red);box-shadow:0 0 10px var(--red-glow)}
.alert.grn{background:var(--green-dim);color:var(--green);border:2px solid var(--green);box-shadow:0 0 10px var(--green-glow)}
.alert.org{background:var(--orange-dim);color:var(--orange);border:2px solid var(--orange)}

.oob-bar{display:flex;width:100%;max-width:520px;height:34px;border-radius:6px;overflow:hidden}
.oob-seg{height:100%;transition:width .6s;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.75rem;font-weight:600;color:#fff;overflow:hidden}
.oob-normal{background:var(--blue)}.oob-over{background:var(--red);animation:oob-pulse 1.5s infinite}
@keyframes oob-pulse{0%,100%{opacity:.8}50%{opacity:1}}

.leak-row{display:flex;gap:.45rem;flex-wrap:wrap;justify-content:center}
.leak-item{font-family:var(--mono);font-size:.8rem;padding:.35rem .6rem;border-radius:6px;background:var(--bg3);opacity:0;transform:translateY(5px);transition:all .3s}
.leak-item.s{opacity:1;transform:translateY(0)}
.leak-item .lk{color:var(--fg2)}.leak-item .lv{font-weight:700;margin-left:.35rem}

.spray{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px;max-width:560px;width:100%}
.spray-b{height:18px;border-radius:4px;background:var(--bg3);transition:all .12s}
.spray-b.fill{background:var(--red);opacity:.6}

.sfl{display:flex;flex-direction:column;gap:.2rem;max-width:560px;margin:0 auto;width:100%}
.ss{display:flex;align-items:center;gap:.5rem;padding:.4rem .65rem;border-radius:6px;background:var(--bg3);font-size:.88rem;opacity:0;transform:translateY(4px);transition:all .35s}
.ss.s{opacity:1;transform:translateY(0)}
.sn{font-family:var(--mono);font-size:.72rem;font-weight:700;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sc{width:2px;height:5px;background:var(--fg3);opacity:.2;margin-left:1.1rem}

.rce-term{font-family:var(--mono);font-size:.88rem;background:#161820;color:#8cc8a0;border-radius:9px;padding:.85rem 1rem;max-width:540px;width:100%;line-height:1.7}
.rce-line{opacity:0;transition:opacity .3s}.rce-line.s{opacity:1}
.rce-cursor{display:inline-block;width:9px;height:16px;background:#8cc8a0;animation:blinkcur .7s step-end infinite;vertical-align:middle}
@keyframes blinkcur{0%,100%{opacity:1}50%{opacity:0}}

.chain{display:flex;flex-direction:column;gap:.25rem;width:100%;max-width:560px;margin:0 auto}
.cn{display:flex;align-items:center;gap:.5rem;padding:.4rem .65rem;border-radius:6px;font-family:var(--mono);font-size:.85rem;
  background:var(--bg3);color:var(--fg2);opacity:0;transform:translateX(-12px);transition:all .35s}
.cn.s{opacity:1;transform:translateX(0)}.cn.a{background:var(--green-dim);color:var(--green);border:1px solid var(--green)}
.cn.boom{background:var(--red-dim);color:var(--red);border:1px solid var(--red)}
.ca{width:2px;height:7px;background:var(--fg3);margin-left:1.2rem;opacity:0;transition:opacity .2s}.ca.s{opacity:.3}

@media(max-width:900px){
  .main{flex-direction:column}
  .main-top{flex:0 0 auto;max-height:50vh;overflow-y:auto}
  .expl{flex:1;min-width:0}
}
@media(max-width:600px){
  .vis{padding:.5rem .4rem}
  .hb{width:10px;height:10px}
  .cn,.cl,.cc-row{font-size:.62rem}
  .ent-ico{width:40px;height:40px;font-size:1rem}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="hdr">
  <h1>php2shell Full Chain</h1>
  <p>Pure-HTTP RCE on stock php:8.4.26-apache</p>
</div>
<div class="tabs" id="tabs"></div>
<div class="prog" id="prog"></div>
<div class="main">
  <div class="main-top">
    <div class="vis" id="vis"></div>
    <div class="sidebar">
      <div class="vals" id="vals"></div>
    </div>
  </div>
  <div class="expl" id="expl" style="overflow-y:auto"></div>
</div>
<div class="nav">
  <button id="prv" disabled>&#8592;</button>
  <span class="ctr" id="ctr">1/14</span>
  <button id="nxt" class="pri">&#8594;</button>
</div>

<script>
function cc(title,rows){
  return `<div class="cc"><div class="cc-title">${title}</div>${rows.map(r=>{
    const cls=r.cls?' '+r.cls:'';const ind=r.indent?`<span class="cc-indent" style="width:${r.indent*11}px"></span>`:'';
    const note=r.note?`<span class="cc-note">${r.note}</span>`:'';
    return `<div class="cc-row${cls}">${ind}<span class="cc-fn">${r.fn}</span><span class="cc-loc">${r.loc}</span>${note}</div>`;
  }).join('')}</div>`;
}

function stateHtml(id,mod,hsv){
  function item(k,v,cls){return `<div class="vp-item${cls?' '+cls:''}">`+
    `<span class="vp-key">${k}</span><span class="vp-val">${v}</span></div>`;}
  return `<div class="vals-title">Process Globals</div>`
    +item('PS(id)',id.v,id.c)
    +item('PS(mod_data)',mod.v,mod.c)
    +item('PS(hsv)',hsv.v,hsv.c);
}

function httpBlock(tag,tagCls,label,lines){
  return `<div class="httpreq" style="margin-top:.5rem"><div class="httpreq-hdr">
    <span class="httpreq-tag ${tagCls}">${tag}</span>
    <span class="httpreq-label">${label}</span>
  </div><div class="httpreq-body open"><pre class="httpreq-pre">${lines}</pre></div></div>`;
}

const N={v:'NULL',c:'dim'}, D={v:'→ DANGLING ⚠',c:'danger'};

const S=[

  expl.innerHTML=`<div class="tag ${tagCls}">${s.label}</div><h2>${s.title}</h2>${s.html}${s.http||''}`;
